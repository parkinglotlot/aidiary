<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>사용자 관리</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <!-- 사용자 관리 CSS -->
    <link rel="stylesheet" th:href="@{/css/user-management.css}" />

    <!-- axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- SweetAlert2 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.10/dist/sweetalert2.min.css"
    />

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.10/dist/sweetalert2.min.js"></script>
  </head>

  <body>
    <!-- 관리자 공통 레이아웃 -->
    <div th:replace="~{fragments/layout :: adminLayout(~{::section})}">
      <section class="admin-user-page">
        <div class="admin-page-container">
          <!-- ========================================
               페이지 헤더
          ========================================= -->
          <header class="admin-page-header">
            <div class="admin-page-title-group">
              <span class="admin-page-eyebrow"> USER MANAGEMENT </span>

              <h2 class="admin-page-title">사용자 관리</h2>

              <p class="admin-page-subtitle">
                가입된 사용자를 검색하고 계정 상태를 관리할 수 있습니다.
              </p>
            </div>
          </header>

          <!-- ========================================
               사용자 목록 카드
          ========================================= -->
          <section class="admin-card user-list-panel">
            <!-- ========================================
                 목록 상단
                 제목 + 검색
            ========================================= -->
            <div class="user-list-toolbar">
              <!-- 왼쪽 -->
              <div class="user-list-title-group">
                <h3 class="admin-card-title">사용자 목록</h3>

                <p class="user-result-count">
                  총
                  <strong id="totalUserCount">0</strong>
                  명
                </p>
              </div>

              <!-- 오른쪽 검색 form -->
              <!-- <form id="userSearchForm" class="user-search-form"> -->
              <div id="userSearchForm" class="user-search-form">
                <!-- 통합 검색 -->
                <input
                  type="text"
                  id="searchKeyword"
                  name="keyword"
                  class="form-input search-input"
                  placeholder="아이디, 이름 또는 이메일 검색"
                  autocomplete="off"
                />

                <!-- 회원 상태 -->
                <select
                  id="userStatus"
                  name="status"
                  class="form-select status-select"
                >
                  <option value="">전체</option>

                  <option value="ACTIVE">정상</option>

                  <option value="INACTIVE">비활성</option>

                  <option value="BLOCKED">차단</option>
                </select>

                <!-- 검색 -->
                <button
                  type="button"
                  id="btnSearch"
                  class="admin-btn admin-btn-primary"
                >
                  검색
                </button>

                <!-- 초기화 -->
                <button
                  type="button"
                  id="btnReset"
                  class="admin-btn admin-btn-secondary"
                >
                  초기화
                </button>
              </div>
              <!-- </form> -->
            </div>

            <!-- ========================================
                 사용자 테이블
            ========================================= -->
            <div class="user-table-container">
              <table class="admin-table user-table">
                <thead>
                  <tr>
                    <th class="column-number">번호</th>

                    <th>아이디</th>

                    <th>이름</th>

                    <th>이메일</th>

                    <th class="column-date">생년월일</th>

                    <th class="column-status">상태</th>

                    <th class="column-action">관리</th>
                  </tr>
                </thead>

                <tbody id="userTableBody">
                  <!--
                    ========================================
                    임시 데이터
                    실제 API 연동 후 삭제 가능
                    ========================================
                  -->

                  <!-- 사용자 1 -->
                  <tr class="user-table-row">
                    <td class="table-index">1</td>

                    <td class="user-login-id">user01</td>

                    <td class="user-name">홍길동</td>

                    <td class="user-email">user01@example.com</td>

                    <td class="user-created-at">2026-08-20</td>

                    <td>
                      <span class="status-badge status-badge-active">
                        정상
                      </span>
                    </td>

                    <td>
                      <button
                        type="button"
                        class="table-action-btn btn-user-detail"
                        data-user-id="1"
                      >
                        상세보기
                      </button>
                    </td>
                  </tr>

                  <!-- 사용자 2 -->
                  <tr class="user-table-row">
                    <td class="table-index">2</td>

                    <td class="user-login-id">user02</td>

                    <td class="user-name">김철수</td>

                    <td class="user-email">user02@example.com</td>

                    <td class="user-created-at">2026-08-21</td>

                    <td>
                      <span class="status-badge status-badge-blocked">
                        차단
                      </span>
                    </td>

                    <td>
                      <button
                        type="button"
                        class="table-action-btn btn-user-detail"
                        data-user-id="2"
                      >
                        상세보기
                      </button>
                    </td>
                  </tr>

                  <!-- 사용자 3 -->
                  <tr class="user-table-row">
                    <td class="table-index">3</td>

                    <td class="user-login-id">user03</td>

                    <td class="user-name">이영희</td>

                    <td class="user-email">user03@example.com</td>

                    <td class="user-created-at">2026-08-22</td>

                    <td>
                      <span class="status-badge status-badge-inactive">
                        비활성
                      </span>
                    </td>

                    <td>
                      <button
                        type="button"
                        class="table-action-btn btn-user-detail"
                        data-user-id="3"
                      >
                        상세보기
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- ========================================
                 사용자 없음
            ========================================= -->
            <div class="table-empty-state hidden" id="emptyUserList">
              <div class="table-empty-icon">!</div>

              <p class="table-empty-title">검색된 사용자가 없습니다.</p>

              <p class="table-empty-description">
                검색 조건을 변경하여 다시 조회해 주세요.
              </p>
            </div>

            <!-- ========================================
                 Pagination
            ========================================= -->
            <div class="pagination-container">
              <nav
                class="admin-pagination"
                id="userPagination"
                aria-label="사용자 목록 페이지"
              >
                <!-- 맨 처음 -->
                <button type="button" class="pagination-btn pagination-first">
                  &lt;&lt;
                </button>

                <!-- 이전 -->
                <button type="button" class="pagination-btn pagination-prev">
                  &lt;
                </button>

                <!-- page 1 -->
                <button
                  type="button"
                  class="pagination-btn active"
                  data-page="1"
                >
                  1
                </button>

                <!-- page 2 -->
                <button type="button" class="pagination-btn" data-page="2">
                  2
                </button>

                <!-- page 3 -->
                <button type="button" class="pagination-btn" data-page="3">
                  3
                </button>

                <!-- page 4 -->
                <button type="button" class="pagination-btn" data-page="4">
                  4
                </button>

                <!-- page 5 -->
                <button type="button" class="pagination-btn" data-page="5">
                  5
                </button>

                <!-- 다음 -->
                <button type="button" class="pagination-btn pagination-next">
                  &gt;
                </button>

                <!-- 맨 마지막 -->
                <button type="button" class="pagination-btn pagination-last">
                  &gt;&gt;
                </button>
              </nav>
            </div>
          </section>
        </div>

        <!-- ========================================
             User Management JS
        ========================================= -->
        <script th:src="@{/javascript/userManagement.js}"></script>
      </section>
    </div>
  </body>
</html>

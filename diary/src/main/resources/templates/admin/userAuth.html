<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>사용자 관리</title>

    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.10/dist/sweetalert2.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.10/dist/sweetalert2.min.js"></script>
  </head>

  <body>
    <div th:replace="~{fragments/layout :: adminLayout(~{::section})}">
      <section class="admin-user-page">
        <div class="admin-page-container">
          <!-- 페이지 헤더 -->
          <header class="admin-page-header">
            <div class="admin-page-title-group">
              <span class="admin-page-eyebrow">USER MANAGEMENT</span>

              <h2 class="admin-page-title">사용자 관리</h2>

              <p class="admin-page-subtitle">
                가입된 사용자를 검색하고 계정 상태를 관리할 수 있습니다.
              </p>
            </div>
          </header>

          <!-- 검색 카드 -->
          <section class="admin-card user-search-panel">
            <div class="admin-card-header">
              <div>
                <h3 class="admin-card-title">사용자 검색</h3>

                <p class="admin-card-description">
                  검색 조건을 선택하고 사용자 정보를 조회하세요.
                </p>
              </div>
            </div>

            <div class="admin-card-body">
              <div class="user-search-form">
                <!-- 검색 조건 -->
                <div class="form-group">
                  <label for="searchType" class="form-label"> 검색 조건 </label>

                  <select id="searchType" name="searchType" class="form-select">
                    <option value="loginId">아이디</option>

                    <option value="name">이름</option>

                    <option value="email">이메일</option>
                  </select>
                </div>

                <!-- 검색어 -->
                <div class="form-group form-group-grow">
                  <label for="searchKeyword" class="form-label"> 검색어 </label>

                  <div class="search-input-wrapper">
                    <input
                      type="text"
                      id="searchKeyword"
                      name="searchKeyword"
                      class="form-input search-input"
                      placeholder="검색어를 입력하세요"
                    />
                  </div>
                </div>

                <!-- 상태 -->
                <div class="form-group">
                  <label for="userStatus" class="form-label"> 회원 상태 </label>

                  <select id="userStatus" name="userStatus" class="form-select">
                    <option value="">전체</option>

                    <option value="ACTIVE">정상</option>

                    <option value="INACTIVE">비활성</option>

                    <option value="BLOCKED">차단</option>
                  </select>
                </div>

                <!-- 버튼 -->
                <div class="search-action-group">
                  <button
                    type="button"
                    id="btnSearch"
                    class="admin-btn admin-btn-primary"
                  >
                    검색
                  </button>

                  <button
                    type="button"
                    id="btnReset"
                    class="admin-btn admin-btn-secondary"
                  >
                    초기화
                  </button>
                </div>
              </div>
            </div>
          </section>

          <!-- 사용자 목록 -->
          <section class="admin-card user-list-panel">
            <!-- 목록 헤더 -->
            <div class="admin-card-header user-list-toolbar">
              <div class="user-list-title-group">
                <h3 class="admin-card-title">사용자 목록</h3>

                <p class="user-result-count">
                  총
                  <strong id="totalUserCount">0</strong>
                  명
                </p>
              </div>
            </div>

            <!-- 테이블 -->
            <div class="user-table-container">
              <table class="admin-table user-table">
                <thead>
                  <tr>
                    <th class="column-number">번호</th>

                    <th>아이디</th>

                    <th>이름</th>

                    <th>이메일</th>

                    <th class="column-date">가입일</th>

                    <th class="column-status">상태</th>

                    <th class="column-action">관리</th>
                  </tr>
                </thead>

                <tbody id="userTableBody">
                  <!-- 임시 데이터 -->
                  <tr class="user-table-row">
                    <td class="table-index">1</td>

                    <td class="user-login-id">user01</td>

                    <td class="user-name">홍길동</td>

                    <td class="user-email">user01@example.com</td>

                    <td class="user-created-at">2026-08-20</td>

                    <td>
                      <span class="status-badge status-badge-active">
                        정상
                      </span>
                    </td>

                    <td>
                      <button
                        type="button"
                        class="table-action-btn btn-user-detail"
                        data-user-id="1"
                      >
                        상세보기
                      </button>
                    </td>
                  </tr>

                  <tr class="user-table-row">
                    <td class="table-index">2</td>

                    <td class="user-login-id">user02</td>

                    <td class="user-name">김철수</td>

                    <td class="user-email">user02@example.com</td>

                    <td class="user-created-at">2026-08-21</td>

                    <td>
                      <span class="status-badge status-badge-blocked">
                        차단
                      </span>
                    </td>

                    <td>
                      <button
                        type="button"
                        class="table-action-btn btn-user-detail"
                        data-user-id="2"
                      >
                        상세보기
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- 검색 결과 없음 -->
            <div
              class="table-empty-state"
              id="emptyUserList"
              style="display: none"
            >
              <div class="table-empty-icon">!</div>

              <p class="table-empty-title">검색된 사용자가 없습니다.</p>

              <p class="table-empty-description">
                검색 조건을 변경하여 다시 조회해 주세요.
              </p>
            </div>

            <!-- 페이지네이션 -->
            <div class="pagination-container">
              <nav
                class="admin-pagination"
                id="userPagination"
                aria-label="사용자 목록 페이지"
              >
                <button type="button" class="pagination-btn pagination-prev">
                  이전
                </button>

                <button type="button" class="pagination-btn active">1</button>

                <button type="button" class="pagination-btn">2</button>

                <button type="button" class="pagination-btn">3</button>

                <button type="button" class="pagination-btn pagination-next">
                  다음
                </button>
              </nav>
            </div>
          </section>
        </div>

        <script th:src="@{/javascript/userManagement.js}"></script>
      </section>
    </div>
  </body>
</html>
